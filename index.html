<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>asistencia-evento</title>
    <script>
      (function () {
        try {
          var m = window.location.pathname.match(/^\/e\/([^\/]+)\//i)
          if (!m) return
          var cached = localStorage.getItem('ae:branding:' + m[1].toLowerCase())
          if (!cached) return
          var b = JSON.parse(cached)
          var hex = /^#[0-9a-fA-F]{3,8}$/
          var r = document.documentElement.style
          if (b.accent && hex.test(b.accent)) r.setProperty('--accent', b.accent)
          if (b.accentStrong && hex.test(b.accentStrong)) r.setProperty('--accent-strong', b.accentStrong)
          if (b.accent2 && hex.test(b.accent2)) r.setProperty('--accent2', b.accent2)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
